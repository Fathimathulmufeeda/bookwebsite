@if (dialogService.state().open) {

<div class="fixed inset-0 z-[110] flex items-center justify-center bg-black/50 px-4" (click)="cancel()">

  <div
    class="w-full max-w-sm rounded-md bg-white p-6 shadow-2xl animate-[fadeIn_0.15s_ease-out]"
    (click)="$event.stopPropagation()">

    <h3 class="font-serif text-xl font-medium text-[#213027]">
      {{ dialogService.state().title }}
    </h3>

    <p class="mt-3 text-sm leading-6 text-[#5c645d]">
      {{ dialogService.state().message }}
    </p>

    <div class="mt-6 flex justify-end gap-3">

      <button type="button" (click)="cancel()"
        class="h-10 rounded-sm border border-[#d8d0c2] px-5 text-[11px] font-bold uppercase tracking-wide text-[#3a3f3b] transition hover:bg-[#f2ece1]">
        {{ dialogService.state().cancelText }}
      </button>

      <button type="button" (click)="confirm()"
        class="h-10 rounded-sm px-5 text-[11px] font-bold uppercase tracking-wide text-white transition"
        [ngClass]="dialogService.state().danger ? 'bg-red-600 hover:bg-red-700' : 'bg-[#193629] hover:bg-[#28503b]'">
        {{ dialogService.state().confirmText }}
      </button>

    </div>

  </div>

</div>

}
