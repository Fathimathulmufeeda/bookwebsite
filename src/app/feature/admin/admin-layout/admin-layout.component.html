<div class="min-h-screen bg-[#f8f5ef]">

    <!-- Fixed Sidebar -->
    <aside class="fixed left-0 top-0 z-40 h-screen w-64 bg-[#193629] text-white">

        <!-- Logo -->
        <div class="flex h-20 items-center border-b border-white/10 px-6">
            <div>
                <h1 class="text-2xl font-bold tracking-[0.25em]">
                    NOVA
                </h1>

                <p class="text-xs tracking-[0.3em] text-white/60">
                    BOOKSHOP
                </p>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="px-4 py-6">

            <p class="mb-4 px-3 text-xs font-semibold uppercase tracking-wider text-white/40">
                Management
            </p>

            <!-- Dashboard -->
            <a routerLink="/admin" routerLinkActive="bg-white/10" [routerLinkActiveOptions]="{ exact: true }"
                class="mb-2 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-white/80 transition hover:bg-white/10 hover:text-white">
                <span>📊</span>
                <span>Dashboard</span>
            </a>

            <!-- Products -->
            <a routerLink="/admin/products" routerLinkActive="bg-white/10"
                class="mb-2 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-white/80 transition hover:bg-white/10 hover:text-white">
                <span>📚</span>
                <span>Products</span>
            </a>

            <!-- Users -->
            <a routerLink="/admin/users" routerLinkActive="bg-white/10"
                class="mb-2 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-white/80 transition hover:bg-white/10 hover:text-white">
                <span>👥</span>
                <span>Users</span>
            </a>

            <!-- Orders -->
            <a routerLink="/admin/orders" routerLinkActive="bg-white/10"
                class="mb-2 flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-white/80 transition hover:bg-white/10 hover:text-white">
                <span>📦</span>
                <span>Orders</span>
            </a>

        </nav>

        <!-- Bottom Logout -->
        <div class="absolute bottom-0 left-0 w-full border-t border-white/10 p-4">

            <button type="button" (click)="logout()" class="flex w-full items-center gap-3 rounded-lg
                               px-4 py-3 text-white/70 transition
                               hover:bg-white/10 hover:text-white">
                <span>↪</span>
                <span>Logout</span> </button>

        </div>

    </aside>


    <!-- Main Area -->
    <div class="ml-64">

        <!-- Fixed Topbar -->
        <header
            class="fixed left-64 right-0 top-0 z-30 flex h-20 items-center justify-between border-b border-gray-200 bg-white px-8 shadow-sm">

            <div>
                <h2 class="text-xl font-semibold text-[#193629]">
                    Admin Panel
                </h2>

                <p class="text-sm text-gray-500">
                    Manage your Nova Bookshop
                </p>
            </div>

            <div class="flex items-center gap-3">

                <div
                    class="flex h-10 w-10 items-center justify-center rounded-full bg-[#193629] text-sm font-semibold text-white">
                    A
                </div>

                <div class="hidden sm:block">
                    <p class="text-sm font-semibold text-gray-800">
                        Nova Admin
                    </p>

                    <p class="text-xs text-gray-500">
                        Administrator
                    </p>
                </div>

            </div>

        </header>


        <!-- Page Content -->
        <main class="min-h-screen pt-20">

            <router-outlet></router-outlet>

        </main>

    </div>

    </div>
